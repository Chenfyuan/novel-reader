name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 37 and build-tools 37.0.0
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Unit & screenshot tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk moyue-${{ github.ref_type == 'tag' && github.ref_name || 'debug' }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: moyue-debug-apk
          path: moyue-*.apk
